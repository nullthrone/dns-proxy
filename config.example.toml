# dns-proxy example configuration.
# Every listener needs an explicit 'allow' list; nothing is open by default.

# All values optional; shown with their defaults.
[limits]
udp_max_inflight = 1024          # concurrent UDP queries per listener (excess dropped)
tcp_max_connections = 256        # concurrent TCP/DoT/DoH connections per listener
tcp_max_inflight_per_conn = 16   # concurrent queries per connection / HTTP/2 streams
tcp_idle_timeout_ms = 10000
tls_handshake_timeout_ms = 5000
upstream_timeout_ms = 2000       # one attempt against one upstream
query_timeout_ms = 5000          # overall, across failover attempts
dot_pool_size = 8                # idle connections kept per DoT upstream

# --- Inbound -----------------------------------------------------------------

[[listen]]
proto = "udp"
addr = "127.0.0.1:53"
allow = ["127.0.0.0/8"]

[[listen]]
proto = "tcp"
addr = "127.0.0.1:53"
allow = ["127.0.0.0/8"]

[[listen]]
proto = "udp"
addr = "[::1]:53"
allow = ["::1/128"]

[[listen]]
proto = "tcp"
addr = "[::1]:53"
allow = ["::1/128"]

# DoT and DoH need a certificate. With the shipped systemd unit, use
# LoadCredential= and reference the files via ${CREDENTIALS_DIRECTORY}.
#
