# key = "${CREDENTIALS_DIRECTORY}/key.pem"
#
# [[listen]]
# proto = "doh"
# addr = "0.0.0.0:443"
# allow = ["192.168.0.0/16", "10.0.0.0/8"]
# cert = "${CREDENTIALS_DIRECTORY}/cert.pem"
# key = "${CREDENTIALS_DIRECTORY}/key.pem"
# path = "/dns-query"

# --- Upstreams (tried in order, failed ones are deprioritised for 30 s) -------
# 'addrs' are bootstrap addresses: upstream hostnames are never resolved.
# The name / URL host is used for SNI and certificate verification only.

[[upstream]]
type = "dot"
name = "dns.quad9.net"
addrs = ["9.9.9.9:853", "149.112.112.112:853", "[2620:fe::fe]:853"]

[[upstream]]
type = "doh"
url = "https://cloudflare-dns.com/dns-query"
addrs = ["1.1.1.1:443", "1.0.0.1:443", "[2606:4700:4700::1111]:443"]
# ca_file = "/etc/dns-proxy/upstream-ca.pem"  # replaces the built-in Mozilla roots
